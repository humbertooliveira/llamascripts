[*]
flash-attn = on
n-gpu-layers = 99
jinja = true
; Reduce ubatch to improve cache management stability
ubatch-size = 2048    
; Try f16 cache if VRAM allows, otherwise q8_0 is fine but more prone to shifts
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
; Essential for Qwen 3.5 architectures
ctx-shift = true
swa-full = true

[Qwen_Qwen3.5-9B-Q6_K.gguf]
alias = qwen3:9b
; 128k is the native 'sweet spot' for stability in current builds
ctx-size = 131072   
split-mode = none     
; Use the modern 'device' string for authoritative selection
device = cuda1
main-gpu = 1

[mxbai-embed-large-v1-f16.gguf]
alias = embedding-model
split-mode = none
device = cuda1
main-gpu = 1
ctx-size = 1024
embedding = true

