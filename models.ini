; GLOBAL: Default for any model not listed below
[*]
split-mode = none     ; Keep it on a single GPU for speed
main-gpu = 1          ; Force it to your dedicated LLM card
ctx-size = 32768
n-gpu-layers = 99
flash-attn = on
split-mode = layer
jinja = true
ubatch-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0

; SPECIFIC: Your Qwen 9B Coding Model
[qwen3-test]
alias = coding-model
ctx-size = 131072   ; Doubled context for large C# files (uses ~10GB VRAM) 64k = 65536 | 128k = 131072 | 256k = 262144
split-mode = none     ; Keep it on a single GPU for speed
main-gpu = 1          ; Force it to your dedicated LLM card
n-gpu-layers = 99
flash-attn = on
split-mode = layer
jinja = true
ubatch-size = 8192
cache-type-k = q8_0
cache-type-v = q8_0

; SPECIFIC: Your Embedding Model (for Roo Code indexing)
[nomic-embed-text-v1.5.Q6_K.gguf]
alias = embedding-model
split-mode = none
main-gpu = 1
ctx-size = 1024
embedding = true